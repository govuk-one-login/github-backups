name: GitHub backup stack build and deploy

on:
  push:
    branches:
      - main
    paths:
      - 'template.yaml'

defaults:
  run:
    shell: bash

permissions: read-all

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v6

      - name: Setup SAM
        uses: aws-actions/setup-sam@v3

      - name: Assume temporary AWS role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.GH_ACTIONS_ROLE_ARN }}
          aws-region: 'eu-west-2'

      - name: SAM validate
        run: sam validate -t template.yaml

      - name: SAM build
        run:  sam build -t template.yaml

      - name: Deploy SAM app
        uses: govuk-one-login/di-devplatform-upload-action@ec09f4b1f8648fe21dd18a40a2d8e2fa94d0ad41 # v4.2.0
        with:
            artifact-bucket-name: ${{ secrets.ARTIFACT_BUCKET_NAME }}
            working-directory: ./sam-app
            template-file: .aws-sam/build/template.yaml
